# Infraestructura como código del entorno DESPLEGADO (no del devcontainer).
#
# Uso en el servidor del laboratorio o en cualquier máquina con Docker:
#   docker compose up -d --build
#   curl http://localhost:3000/health
#
# El volumen `audioshare-data` hace que data/audioshare.sqlite y las pistas
# de data/tracks/ sobrevivan a un `docker compose up --build` (redeploy).
# Sin este volumen, cada redeploy empieza sin salas ni pistas guardadas.
services:
  api:
    build: .
    image: audioshare-api:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - DATABASE_FILE=data/audioshare.sqlite
      - LOG_LEVEL=info
      - CORS_ORIGINS=https://audioshare.iscoutb.dev
    volumes:
      - audioshare-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  audioshare-data:
