name: APK de Android

# Corre solo cuando cambia lo que afecta al APK (la app, Android o las
# dependencias), a mano (Actions > APK de Android > Run workflow) o al subir una
# etiqueta v* (por ejemplo v1.0.0), que además publica una Release con el APK.
# Un cambio solo de servidor o de documentación no recompila el APK.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/android-apk.yml'
    tags: ['v*']

# Si llegan dos pushes seguidos, solo interesa el APK del último.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    # Escribir en el repo solo hace falta para crear la Release de una etiqueta.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: flutter pub get --enforce-lockfile
      # Un APK no debe salir de un commit con pruebas rotas.
      - run: flutter test
      # El número de ejecución sube el versionCode en cada APK.
      - name: Compilar el APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Nombrar el APK con el commit
        run: |
          short="${GITHUB_SHA::7}"
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/audioshare-${short}.apk"
          (cd dist && sha256sum "audioshare-${short}.apk" > "audioshare-${short}.apk.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: audioshare-apk-${{ github.run_number }}
          path: dist/*
          retention-days: 30
      - name: Publicar la Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --verify-tag \
            --title "AudioShare ${GITHUB_REF_NAME}" \
            --notes "APK de Android compilado por GitHub Actions desde el commit ${GITHUB_SHA}. Integridad: archivo .sha256 adjunto."
