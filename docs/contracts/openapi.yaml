openapi: 3.1.0
info:
  title: AudioShare API
  description: >
    API REST para la gestión de salas de AudioShare: creación de salas,
    incorporación de receptores, control de reproducción (play/pause) y
    consulta de estado. El canal de eventos en tiempo real (push hacia los
    receptores) se describe por separado en docs/contracts/asyncapi.yaml.
  version: 0.1.0
servers:
  - url: http://localhost:3000
    description: Entorno local de desarrollo

paths:
  /health:
    get:
      operationId: getHealth
      summary: Estado del servicio
      responses:
        "200":
          description: El servicio está operativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /rooms:
    post:
      operationId: createRoom
      summary: Crea una sala y registra al emisor
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                emitterId:
                  type: string
                  description: >
                    Nombre que el emisor elige para sí mismo, de 1 a 30
                    caracteres (se guarda sin espacios al borde y sin
                    caracteres de control). Si se omite, el servidor genera
                    uno (crypto.randomUUID()).
      responses:
        "201":
          description: >
            Sala creada. El `roomId` es un código de 6 dígitos (con ceros a la
            izquierda, por ejemplo `048213`). Las salas anteriores a la semana
            14 conservan su UUID y siguen funcionando.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateRoomResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          description: El servidor no pudo guardar la sala (fallo de almacenamiento).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rooms/{roomId}:
    get:
      operationId: getRoom
      summary: Consulta el estado de una sala
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Estado actual de la sala
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomState"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      operationId: closeRoom
      summary: El emisor cierra la sala para todos
      description: >
        Avisa con `room.closed`, borra la pista y la sala, y corta las
        conexiones abiertas.
      security:
        - emitterKey: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "204":
          description: Sala cerrada
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /rooms/{roomId}/receivers/{receiverId}:
    delete:
      operationId: leaveRoom
      summary: Un receptor deja la sala
      description: >
        Quita al receptor de la lista y corta su conexión; el emisor y los
        demás reciben `participant.left` con `reason: left`. No sirve para
        quitar al emisor. Los receptores no tienen llave: se reconocen por su
        identificador.
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: receiverId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: El receptor salió
        "404":
          $ref: "#/components/responses/NotFound"

  /rooms/{roomId}/kick:
    post:
      operationId: kickReceiver
      summary: El emisor expulsa a un receptor
      description: >
        Quita al receptor y veta su nombre en esa sala: si intenta volver a
        entrar recibe 403. Antes de cerrar su conexión recibe `participant.left`
        con `reason: removed`.
      security:
        - emitterKey: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiverId]
              properties:
                receiverId:
                  type: string
      responses:
        "204":
          description: Receptor expulsado
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /rooms/{roomId}/events:
    get:
      operationId: watchRoomEvents
      summary: Eventos de la sala para el emisor (NDJSON)
      description: >
        Una línea JSON por evento, con `type`: `participant.joined`,
        `participant.left` (`reason`: `left` o `removed`),
        `participant.connected`, `participant.disconnected`, `track.changed`
        (`trackName`, `trackVersion`) y `room.closed`. Los receptores reciben
        los mismos eventos por su `stream`. No cuenta como receptor.
      security:
        - emitterKey: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Flujo de eventos
          content:
            application/x-ndjson:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /rooms/{roomId}/receivers:
    post:
      operationId: addReceiver
      summary: Agrega un receptor a una sala existente
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                receiverId:
                  type: string
                  description: >
                    Nombre que el receptor elige, con las mismas reglas que
                    `emitterId`. Si se omite, el servidor genera uno.
      responses:
        "201":
          description: Receptor agregado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddReceiverResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "409":
          description: >
            El identificador ya pertenece a otro rol en esta sala. Repetir el
            mismo identificador con el mismo rol es idempotente y devuelve 201.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rooms/{roomId}/emitter:
    post:
      operationId: rejoinEmitter
      summary: Vuelve a entrar como emisor de una sala existente
      description: >
        El emisor se prueba con la llave que recibió al crear la sala
        (`emitterKey`), que su dispositivo guarda. Sin llave: 401; con una
        llave que no corresponde: 403. Las salas anteriores a las llaves (sin
        llave guardada) se reconocen por el nombre del emisor en el cuerpo
        (`{"emitterId": "..."}`) hasta que caducan.
      security:
        - emitterKey: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: La llave corresponde al emisor de la sala
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmitterAccessResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /rooms/{roomId}/play:
    post:
      operationId: playRoom
      summary: Inicia la reproducción sincronizada en la sala
      description: >
        Genera un único `startAt` (timestamp del servidor) que se distribuye
        a todos los receptores conectados por el canal de eventos
        (ver asyncapi.yaml, mensaje sync.start).
      security:
        - emitterKey: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: string
      responses:
        "200":
          description: Reproducción iniciada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /rooms/{roomId}/pause:
    post:
      operationId: pauseRoom
      summary: Pausa la reproducción de la sala
      security:
        - emitterKey: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Reproducción pausada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PauseResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /rooms/{roomId}/audio:
    post:
      operationId: sendAudioChunk
      summary: Distribuye el evento de demostración audio.chunk (no audio binario)
      security:
        - emitterKey: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: string
                  description: Texto demostrativo; la pista MP3 se transfiere por /rooms/{roomId}/track.
      responses:
        "200":
          description: Paquete distribuido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioChunk"
        "400":
          description: payload inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /track:
    get:
      summary: Pista de audio de la demostración (MP3)
      description: >
        Los receptores descargan la pista antes de empezar y la reproducen
        localmente en startAt. Admite peticiones Range.
      responses:
        "200":
          description: Archivo de audio
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "404":
          description: Pista no disponible

  /rooms/{roomId}/track:
    post:
      operationId: uploadRoomTrack
      summary: Sube o cambia la pista MP3 de una sala
      description: >
        Cada subida reemplaza la pista anterior, deja la sala detenida (posición
        0), sube `trackVersion` y avisa con `track.changed`. El nombre de la
        canción se envía codificado (`encodeURIComponent`) en la cabecera
        `X-Track-Name` (máximo 100 caracteres).
        El emisor sube una pista MP3 completa antes de iniciar la reproducción.
        El archivo se conserva en el almacenamiento persistente del servidor;
        tamaño máximo 50 MiB.
      security:
        - emitterKey: []
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          audio/mpeg:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Pista guardada
          content:
            application/json:
              schema:
                type: object
                required: [roomId, bytes]
                properties:
                  roomId:
                    type: string
                  bytes:
                    type: integer
        "400":
          description: Archivo MP3 vacío o no válido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          description: Error al persistir la pista
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getRoomTrack
      summary: Descarga la pista MP3 de una sala
      description: >
        Devuelve los mismos bytes subidos por el emisor. Admite Range para que
        just_audio pueda buscar la posición sincronizada.
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: Range
          in: header
          required: false
          schema:
            type: string
          description: Rango de bytes solicitado por el reproductor.
      responses:
        "200":
          description: Archivo MP3 completo
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "206":
          description: Rango del archivo MP3
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "404":
          description: Sala o pista no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /time:
    get:
      operationId: getServerTime
      summary: Reloj del servidor
      description: >
        Devuelve el instante actual del reloj del servidor (epoch ms). Los
        receptores toman varias muestras para estimar su offset de reloj
        (reloj_servidor − reloj_local) antes de programar el arranque en
        `startAt` (ADR-0005 y ADR-0007).
      responses:
        "200":
          description: Hora del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServerTime"

  /rooms/{roomId}/receivers/{receiverId}/ack:
    post:
      operationId: ackReceiverStart
      summary: El receptor informa cuándo empezó a reproducir
      description: >
        `startedAt` es el instante en el reloj LOCAL del receptor y
        `offsetMs` el offset que estimó. El servidor lo lleva a su propio
        reloj (`startedAt + offsetMs`) para medir el desfase entre receptores
        (EC-01).
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: receiverId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startedAt, offsetMs]
              properties:
                startedAt:
                  type: number
                offsetMs:
                  type: number
      responses:
        "200":
          description: ACK registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
        "400":
          description: startedAt u offsetMs inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La sala aún no ha iniciado reproducción
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /rooms/{roomId}/sync:
    get:
      operationId: getSyncReport
      summary: Informe de sincronización de la última reproducción
      description: >
        Diferencia entre el primer y el último receptor en arrancar, a partir
        de los ACK recibidos, y su comparación con el umbral de EC-01.
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Informe de sincronización
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncReport"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: La sala aún no ha iniciado reproducción
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    emitterKey:
      type: http
      scheme: bearer
      description: Llave de emisor de la sala (`emitterKey`).
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      description: >
        Código de la sala: 6 dígitos (o un UUID en salas anteriores). Las salas
        sin actividad durante `ROOM_TTL_HOURS` (24 h por defecto) se borran con
        su pista. Consultar códigos inexistentes de forma repetida bloquea al
        origen unos instantes (429).
      schema:
        type: string

  responses:
    NotFound:
      description: Sala no encontrada
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BadRequest:
      description: Petición inválida (por ejemplo, un nombre vacío o de más de 30 caracteres).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: "Falta la llave de emisor (cabecera `Authorization: Bearer ...`)."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: La llave de emisor no corresponde a esta sala.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: >
        Demasiados intentos con códigos de sala inexistentes desde este origen.
        La cabecera `Retry-After` indica los segundos de espera.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      required: [status, system, modules, startedAt, storage]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: >
            `degraded` si el servidor no puede escribir en el almacenamiento.
            Aun así responde 200: el healthcheck de Docker solo mide que el
            proceso vive.
        storage:
          type: string
          enum: [ok, error]
          description: Resultado de una escritura de prueba en SQLite.
        system:
          type: string
        modules:
          type: array
          items:
            type: string
        startedAt:
          type: string
          description: >
            Instante (ISO 8601) en que arrancó el servicio. Cambia cuando el
            proceso se reinicia, por ejemplo tras un redespliegue.
        commit:
          type: string
          description: >
            Commit con el que se construyó la imagen (variable `GIT_SHA`).
            Vale `unknown` si el build no lo recibió; en ese caso no acredita
            qué revisión se sirve.

    Participant:
      type: object
      required: [id, role, joinedAt]
      properties:
        id:
          type: string
        role:
          type: string
          enum: [emitter, receiver]
        joinedAt:
          type: string
          format: date-time
        connected:
          type: boolean
          description: >
            Solo en receptores: si tiene el canal de eventos abierto ahora
            mismo.

    PlaybackState:
      type: object
      required: [playing, positionMs]
      properties:
        playing:
          type: boolean
        positionMs:
          type: number

    RoomState:
      type: object
      required:
        - roomId
        - createdAt
        - status
        - playbackState
        - startAt
        - participants
        - connectedReceivers
        - trackName
        - trackVersion
      properties:
        roomId:
          type: string
        trackName:
          type: [string, "null"]
          description: Nombre de la canción actual, si el emisor lo envió.
        trackVersion:
          type: integer
          description: Veces que se ha subido o cambiado la pista (0 = sin pista).
        createdAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [stopped, playing, paused]
        playbackState:
          $ref: "#/components/schemas/PlaybackState"
        startAt:
          type: [number, "null"]
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
        connectedReceivers:
          type: integer

    CreateRoomResponse:
      type: object
      required: [roomId, emitterId, emitterKey]
      properties:
        roomId:
          type: string
        emitterId:
          type: string
        emitterKey:
          type: string
          description: >
            Llave del emisor, entregada solo en esta respuesta (el servidor
            guarda su hash SHA-256). Se envía como `Authorization: Bearer ...`
            en las acciones del emisor; quien la pierda no puede recuperarla.

    EmitterAccessResponse:
      type: object
      required: [roomId, emitterId, role]
      properties:
        roomId:
          type: string
        emitterId:
          type: string
        role:
          type: string
          const: emitter

    AddReceiverResponse:
      type: object
      required: [roomId, receiverId, role]
      properties:
        roomId:
          type: string
        receiverId:
          type: string
        role:
          type: string
          const: receiver

    PlayResponse:
      type: object
      required:
        - type
        - startAt
        - roomId
        - status
        - playbackState
        - participants
        - audioChunk
      properties:
        type:
          type: string
          const: sync.start
        startAt:
          type: number
        positionMs:
          type: number
          description: Posición de la pista (ms) que debe sonar en startAt.
        roomId:
          type: string
        status:
          type: string
          enum: [stopped, playing, paused]
        playbackState:
          $ref: "#/components/schemas/PlaybackState"
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
        audioChunk:
          $ref: "#/components/schemas/AudioChunk"

    PauseResponse:
      type: object
      required: [type, positionMs, roomId, status, playbackState, startAt]
      properties:
        type:
          type: string
          const: sync.pause
        positionMs:
          type: number
        roomId:
          type: string
        status:
          type: string
          enum: [stopped, playing, paused]
        playbackState:
          $ref: "#/components/schemas/PlaybackState"
        startAt:
          type: [number, "null"]

    AudioChunk:
      type: object
      required: [type, sequence, payload]
      properties:
        type:
          type: string
          const: audio.chunk
        sequence:
          type: integer
        payload:
          type: string

    ServerTime:
      type: object
      required: [serverTime]
      properties:
        serverTime:
          type: number

    AckResponse:
      type: object
      required: [roomId, startAt, receiverId, startedAtServerClock, deviationMs]
      properties:
        roomId:
          type: string
        startAt:
          type: number
        receiverId:
          type: string
        startedAtServerClock:
          type: number
        deviationMs:
          type: number

    SyncReport:
      type: object
      required: [roomId, startAt, acks, spreadMs, thresholdMs, withinThreshold]
      properties:
        roomId:
          type: string
        startAt:
          type: number
        acks:
          type: array
          items:
            type: object
            required: [receiverId, startedAtServerClock, deviationMs]
            properties:
              receiverId:
                type: string
              startedAtServerClock:
                type: number
              deviationMs:
                type: number
        spreadMs:
          type: [number, "null"]
        thresholdMs:
          type: number
        withinThreshold:
          type: [boolean, "null"]

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
